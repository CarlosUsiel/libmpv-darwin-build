name: ci

# PlayTorrio trim: manual runs only; builds only what media_kit_libs_macos_video /
# media_kit_libs_ios_video download (xcframeworks, universal, video-default).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string baked into archive names"
        required: true
        default: "0.6.8-pt1"

jobs:
  ci:
    name: ci
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - name: Xcode version
        run: /Applications/Xcode_16.1.0.app/Contents/Developer/usr/bin/xcodebuild -version

      # See ${workspace}/nix/overlays/xcode.md
      - name: Set up Xcode in Nix store
        run: |
          XCODE_APP=$(realpath /Applications/Xcode_16.1.0.app)
          NIX_STORE_PATH="/nix/store/v92p4w6nxhyhq6lv0maq5cbb59mbxw5b-Xcode.app"
          HASH="sha256:d63c91255c8e98603b7f1470067c5225ab673850eed35449f5a0105c936e581c"

          sudo cp -a $XCODE_APP $NIX_STORE_PATH
          sudo sqlite3 /nix/var/nix/db/db.sqlite "INSERT INTO ValidPaths (path,hash,registrationTime) VALUES ('$NIX_STORE_PATH','$HASH',$(date +%s))"

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build (macOS + iOS xcframeworks, video-default only)
        run: |
          VERSION=${{ inputs.version }}
          echo \"$VERSION\" > nix/utils/default/version.nix
          nix build -v --out-link result-macos .#mk-out-archive-xcframeworks-macos-universal-video-default
          nix build -v --out-link result-ios .#mk-out-archive-xcframeworks-ios-universal-video-default
          ls -la result-macos/ result-ios/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          retention-days: 7
          path: |
            result-macos/*.tar.gz
            result-ios/*.tar.gz
